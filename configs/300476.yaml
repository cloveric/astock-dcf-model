cover:
  subtitle: "AI算力PCB核心供应商 | 高多层板 + 高阶HDI | 谷歌TPU链/英伟达链"
  notes:
    - "1. FIN页债务调度(P0-1): 资金缺口=MAX(0,期初现金+经营CF+投资CF+计划分红+计划还款+利息-最低现金)→revolver新增借款; 超额现金先sweep偿还短借/长借, 债务清零后溢出购买理财(交易性金融资产); 货币资金=最低现金(收入×2%), 杜绝\"高现金+高借款\"并存;"
    - "2. 利息=四档债务各自(期初+期末)/2平均余额×分档利率; 该循环依赖已在FIN页\"迭代展开\"区表内展开4轮(第1轮期初余额计息, 第k轮按(期初+上轮期末)/2×利率重算, 与外部不动点法同构且实测6轮内收敛至1e-8, 4轮充足), 末轮输出供IS/CF/BS引用; 全簿无循环引用, 无需开启迭代计算, LibreOffice headless可直接重算验收(v3起);"
    - "3. BS配平项由货币资金改为FIN页revolver新增借款/现金sweep; 历史2024A/2025A的0.1尾差已并入\"其他权益项目(轧差)\"清零(P1-5), 配平差额全期恒=0(容差0.01);"
    - "4. WACC做实(P0-2): 可比公司βl按各自D/E与税率unlever取中位数(Relative_Val页L-O列), 按公司市值口径目标结构relever; Wd=2025A末有息负债/(有息负债+总市值); 原1.6%个股溢价已删除(重复计价, 依据见Assumptions); 采用值=IF(override=\"\",计算值,override), 下游全部引用采用值;"
    - "5. DCF年中折现(P1-4): 估值基准日2026-08-14, t=0.5/1.5/.../4.5; EV→Equity桥已补加其他权益工具投资2025A末28.5亿(P1-3);"
    - "6. CF口径(P2-8): 利息支出经营活动加回、筹资活动列\"偿付利息\"; 投资活动含\"理财净变动\"行;"
    - "7. 权益滚动(P2-9): Equity_Roll页逐项滚动, 盈余公积按归母10%计提; 稀释股数=9.83亿股+稀释工具占位0; Summary页为football field区间汇总;"
    - "8. 预测期资产减值/投资收益等非经常项简化为固定小额(Assumptions\"其他经营损益\"-20百万), 以保证三表严格配平;"
    - "9. 分产品历史收入=港股招股书产品占比×总收入(东财仅披露PCB制造/其他口径); 预测按\"量×价\"驱动并受情景开关调整; 预测期(2026E-2030E)所有单元格均为公式, 硬编码仅限历史实际值(绿色)与蓝色假设输入;"
    - "10. 2026Q1实际: 营收55.19亿(+28.0%), 归母12.88亿(+39.9%); 截至2026-08-17未披露2026H1业绩预告."
