<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>astock-dcf-model — 估值模型构建台</title>
<style>
  :root { --ink:#1a1a1a; --navy:#1F3864; --line:#d9d9d9; --grey:#7f7f7f; --bg:#f7f8fa; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 "Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
         color:var(--ink); background:var(--bg); }
  header { background:var(--navy); color:#fff; padding:18px 32px; }
  header h1 { margin:0; font-size:18px; font-weight:600; letter-spacing:.5px; }
  header p { margin:4px 0 0; font-size:12px; color:#c9d4e8; }
  main { max-width:1080px; margin:24px auto; padding:0 20px; }
  section { background:#fff; border:1px solid var(--line); border-radius:4px;
            padding:20px 24px; margin-bottom:20px; }
  h2 { margin:0 0 14px; font-size:15px; color:var(--navy); border-left:3px solid var(--navy);
       padding-left:8px; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px 20px; }
  label { display:block; font-size:12px; color:var(--grey); margin-bottom:3px; }
  input[type=text], input[type=password], select { width:100%; padding:7px 9px; border:1px solid var(--line);
    border-radius:3px; font:inherit; background:#fff; }
  input:focus, select:focus { outline:none; border-color:var(--navy); }
  .chk { display:flex; align-items:center; gap:7px; padding-top:20px; font-size:13px; }
  button { background:var(--navy); color:#fff; border:0; border-radius:3px; padding:9px 26px;
           font:inherit; cursor:pointer; }
  button:hover { background:#2a4a80; }
  button:disabled { background:#9aa7bd; cursor:default; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--grey); font-weight:500; font-size:12px; }
  .st { font-weight:600; }
  .st-queued { color:#8a6d1a; } .st-running { color:#1F3864; }
  .st-verified { color:#1e7a1e; } .st-built_unverified { color:#9a6700; }
  .st-failed_validation, .st-failed { color:#cc0000; } .st-done { color:#7f7f7f; }
  a.dl { color:var(--navy); text-decoration:none; border:1px solid var(--navy);
         border-radius:3px; padding:3px 12px; font-size:12px; }
  a.dl:hover { background:var(--navy); color:#fff; }
  button.dl { color:var(--navy); background:#fff; border:1px solid var(--navy);
              padding:3px 12px; font-size:12px; }
  button.dl:hover { background:var(--navy); color:#fff; }
  pre { background:#101522; color:#c8d3e8; font:12px/1.5 Menlo,Consolas,monospace;
        padding:12px 14px; border-radius:4px; overflow:auto; max-height:280px;
        white-space:pre-wrap; word-break:break-all; }
  .muted { color:var(--grey); font-size:12px; }
  .err { color:#cc0000; font-size:12px; margin-top:6px; }
  .row { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-top:14px; }
  .token-row { display:grid; grid-template-columns:minmax(240px,1fr) auto; gap:10px;
               align-items:end; max-width:620px; }
  .token-note { margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>astock-dcf-model</h1>
  <p>配置驱动的 A 股 / 港股三表联动估值模型生成器 · DCF + FCFE 双视图 · Checks 12 项机器验收</p>
</header>
<main>
  <section>
    <h2>API 访问令牌</h2>
    <div class="token-row">
      <div>
        <label>Bearer token（服务配置 WEB_API_TOKEN 时必填）</label>
        <input type="password" id="apiToken" maxlength="1024" autocomplete="off"
               placeholder="输入服务端 WEB_API_TOKEN">
      </div>
      <button id="saveToken" type="button">保存令牌</button>
    </div>
    <div class="muted token-note" id="tokenHint">令牌仅保存在当前浏览器的 localStorage，并随每个 API 请求发送。</div>
  </section>

  <section>
    <h2>提交建模任务</h2>
    <div class="grid">
      <div>
        <label>证券代码 (6位A股 / 5位港股, 必填)</label>
        <input type="text" id="code" maxlength="6" placeholder="300476 / 00981">
      </div>
      <div>
        <label>配置文件 (可选, 仓库内路径; 缺省读 configs/&lt;code&gt;.yaml, 无则自动兜底)</label>
        <input type="text" id="config" placeholder="configs/300476.yaml">
      </div>
      <div>
        <label>研究层: dr 档案 (可选)</label>
        <input type="text" id="dr" placeholder="examples/research/dr_300476.md">
      </div>
      <div>
        <label>研究层: 一致预期文件 (可选)</label>
        <input type="text" id="consensus" placeholder="examples/research/consensus_300476.json">
      </div>
      <div>
        <label>研究层: LLM 备忘录</label>
        <select id="llm">
          <option value="off" selected>off (默认)</option>
          <option value="auto">auto (Codex → Claude → Kimi)</option>
          <option value="codex">codex</option>
          <option value="claude">claude</option>
          <option value="kimi">kimi</option>
        </select>
      </div>
      <div class="chk">
        <input type="checkbox" id="announcements">
        <label for="announcements" style="margin:0">抓取东财业绩预告/快报要点</label>
      </div>
    </div>
    <div class="row">
      <span class="muted">任务由 build_model.py 子进程串行执行; 历史三表缺失的标的自动走数据层兜底。</span>
      <button id="submit">提交任务</button>
    </div>
    <div class="err" id="formErr"></div>
  </section>

  <section>
    <h2>任务列表</h2>
    <table>
      <thead><tr>
        <th>ID</th><th>代码</th><th>名称</th><th>状态</th><th>创建时间</th><th>完成时间</th><th>操作</th>
      </tr></thead>
      <tbody id="jobs"><tr><td colspan="7" class="muted">暂无任务</td></tr></tbody>
    </table>
    <div id="detail"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const ST = {
  queued:'排队中', running:'构建中', verified:'已验收',
  built_unverified:'已构建 / 未验收', failed_validation:'验收失败',
  failed:'构建失败', done:'历史完成 / 验收未知'
};
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const TOKEN_KEY = 'astock-dcf-api-token';
let detailId = null;   // 当前展开详情的任务; 进行中时随轮询自动刷新日志尾部

function authOpts(opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  const token = $('apiToken').value.trim();
  if (token) headers.Authorization = 'Bearer ' + token;
  return Object.assign({}, opts, {headers});
}

async function api(path, opts = {}) {
  const r = await fetch(path, authOpts(opts));
  if (!r.ok) {
    let msg = r.status + ' ' + r.statusText;
    try { msg = (await r.json()).detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return r.json();
}

function saveToken() {
  const token = $('apiToken').value.trim();
  try {
    if (token) localStorage.setItem(TOKEN_KEY, token);
    else localStorage.removeItem(TOKEN_KEY);
    $('tokenHint').textContent = token
      ? '令牌已保存在当前浏览器，并用于后续 API 请求。'
      : '令牌已清除；仅回环地址且服务端未配置 token 时可继续使用。';
  } catch (e) {
    $('tokenHint').textContent = '浏览器禁止 localStorage，令牌仅在本页存活。';
  }
  refresh();
}

async function downloadJob(id) {
  try {
    const r = await fetch('/api/jobs/' + encodeURIComponent(id) + '/download', authOpts());
    if (!r.ok) {
      let msg = r.status + ' ' + r.statusText;
      try { msg = (await r.json()).detail || msg; } catch (e) {}
      throw new Error(msg);
    }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'model.xlsx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert(e.message);
  }
}

async function submit() {
  $('formErr').textContent = '';
  const body = {
    code: $('code').value.trim(),
    config: $('config').value.trim() || null,
    dr: $('dr').value.trim() || null,
    consensus: $('consensus').value.trim() || null,
    llm: $('llm').value,
    announcements: $('announcements').checked,
  };
  if (!/^\d{5,6}$/.test(body.code)) { $('formErr').textContent = '代码须为6位A股或5位港股数字'; return; }
  $('submit').disabled = true;
  try {
    const j = await api('/api/jobs', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    detailId = j.id;   // 新任务自动展开详情, 轮询跟踪日志
  }
  catch (e) { $('formErr').textContent = e.message; }
  finally { $('submit').disabled = false; }
  refresh();
}

async function showDetail(id) {
  detailId = id;
  await renderDetail();
}

async function renderDetail() {
  if (!detailId) return;
  let d;
  try { d = await api('/api/jobs/' + detailId); }
  catch (e) { detailId = null; $('detail').innerHTML = ''; return; }   // 任务已被淘汰/删除
  let html = '<h2 style="margin-top:18px">任务 ' + esc(d.id) + ' 详情 (' + esc(ST[d.status] || d.status) + ')</h2>';
  const ps = Object.entries(d.params || {}).map(([k,v]) => k + '=' + v).join('  ');
  html += '<p class="muted">' + esc(ps || '默认参数') + '</p>';
  if (d.error) html += '<p class="err">' + esc(d.error) + '</p>';
  if (d.verify_status) {
    const rc = d.verify_returncode === null || d.verify_returncode === undefined
      ? '—' : d.verify_returncode;
    html += '<p class="muted">验收状态: ' + esc(ST[d.verify_status] || d.verify_status)
      + ' · Verdict: ' + esc(d.verify_verdict || '—') + ' · 退出码: ' + esc(rc) + '</p>';
  }
  if (d.log_tail) html += '<pre>' + esc(d.log_tail) + '</pre>';
  if (d.verify_tail) html += '<h2>LibreOffice 验收摘要</h2><pre>' + esc(d.verify_tail) + '</pre>';
  $('detail').innerHTML = html;
}

async function delJob(id) {
  if (!confirm('删除任务 ' + id + ' 及其产物?')) return;
  try { await api('/api/jobs/' + id, {method:'DELETE'}); }
  catch (e) { alert(e.message); }
  if (detailId === id) { detailId = null; $('detail').innerHTML = ''; }
  refresh();
}

// 自适应轮询: 有 queued/running 任务时 2 秒, 全部终态 15 秒; 页面隐藏时暂停,
// 恢复可见立即刷一次; 提交/删除后由各自 handler 直接调 refresh() 立即刷新
const POLL_FAST = 2000, POLL_SLOW = 15000;
let pollTimer = null;

function scheduleNext(active) {
  clearTimeout(pollTimer);
  if (document.hidden) return;
  pollTimer = setTimeout(refresh, active ? POLL_FAST : POLL_SLOW);
}

async function refresh() {
  let active = false;
  try { active = await refreshOnce(); }
  catch (e) {}                              // 网络/服务异常: 下一轮慢速重试
  finally { scheduleNext(active); }
}

async function refreshOnce() {
  const jobs = await api('/api/jobs');
  const tb = $('jobs');
  if (!jobs.length) { tb.innerHTML = '<tr><td colspan="7" class="muted">暂无任务</td></tr>'; return false; }
  tb.innerHTML = jobs.map(j => {
    let act = '';
    if (j.can_download) {
      const dlText = j.status === 'verified' ? '下载已验收 xlsx' : '下载未验收 xlsx';
      act += '<button class="dl" onclick="downloadJob(\'' + esc(j.id) + '\')">' + dlText + '</button> ';
    }
    if (j.status !== 'queued' && j.status !== 'running')
      act += '<a class="dl" href="javascript:delJob(\'' + esc(j.id) + '\')">删除</a>';
    return '<tr><td><a href="javascript:showDetail(\'' + esc(j.id) + '\')">' + esc(j.id) + '</a></td>' +
      '<td>' + esc(j.code) + '</td><td>' + esc(j.name || '') + '</td>' +
      '<td class="st st-' + esc(j.status) + '">' + esc(ST[j.status] || j.status) + '</td>' +
      '<td>' + esc(j.created_at || '') + '</td><td>' + esc(j.finished_at || '—') + '</td>' +
      '<td>' + act + '</td></tr>';
  }).join('');
  // 进行中的任务: 日志尾部随轮询自动刷新展开; 无展开时自动展开首个进行中任务
  const activeJob = jobs.find(j => j.status === 'running' || j.status === 'queued');
  if (detailId) {
    const cur = jobs.find(j => j.id === detailId);
    if (cur && (cur.status === 'running' || cur.status === 'queued')) await renderDetail();
  } else if (activeJob) {
    detailId = activeJob.id;
    await renderDetail();
  }
  return !!activeJob;
}

$('saveToken').addEventListener('click', saveToken);
$('apiToken').addEventListener('keydown', e => { if (e.key === 'Enter') saveToken(); });
$('submit').addEventListener('click', submit);
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) clearTimeout(pollTimer);   // 隐藏即暂停轮询
  else refresh();                                 // 恢复可见立即刷一次并续排下一轮
});
try { $('apiToken').value = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
refresh();
</script>
</body>
</html>
